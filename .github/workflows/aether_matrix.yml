name: Project AETHER Multi-Channel Matrix

on:
  workflow_dispatch:
    inputs:
      target_pod:
        description: 'Pod to run: "ALL", "WEALTH", "PHYSICS", or "SCALE3D"'
        required: false
        default: 'ALL'
      video_mode:
        description: 'Mode: "short" or "long"'
        required: false
        default: 'short'

permissions:
  contents: write

jobs:
  aether-pod-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aether-pod-${{ matrix.pod }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        pod: ['WEALTH', 'PHYSICS', 'SCALE3D']

    steps:
      - name: Check Pod Filter
        id: filter
        run: |
          INPUT_POD="${{ github.event.inputs.target_pod || 'ALL' }}"
          if [ "$INPUT_POD" = "ALL" ] || [ "$INPUT_POD" = "${{ matrix.pod }}" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        if: steps.filter.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation libgl1 libegl1

      - name: Install AI, XGBoost & Playwright Chromium
        if: steps.filter.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install requests numpy pillow edge-tts playwright xgboost scikit-learn google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
          playwright install --with-deps chromium

      - name: Run AETHER Engine for Pod ${{ matrix.pod }}
        if: steps.filter.outputs.should_run == 'true'
        env:
          POD_NAME: ${{ matrix.pod }}
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'short' }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          WEALTH_CLIENT_ID: ${{ secrets.WEALTH_CLIENT_ID }}
          WEALTH_CLIENT_SECRET: ${{ secrets.WEALTH_CLIENT_SECRET }}
          WEALTH_REFRESH_TOKEN: ${{ secrets.WEALTH_REFRESH_TOKEN }}
          PHYSICS_CLIENT_ID: ${{ secrets.PHYSICS_CLIENT_ID }}
          PHYSICS_CLIENT_SECRET: ${{ secrets.PHYSICS_CLIENT_SECRET }}
          PHYSICS_REFRESH_TOKEN: ${{ secrets.PHYSICS_REFRESH_TOKEN }}
          SCALE3D_CLIENT_ID: ${{ secrets.SCALE3D_CLIENT_ID }}
          SCALE3D_CLIENT_SECRET: ${{ secrets.SCALE3D_CLIENT_SECRET }}
          SCALE3D_REFRESH_TOKEN: ${{ secrets.SCALE3D_REFRESH_TOKEN }}
        run: |
          python aether_engine.py

      - name: Save Self-Learning XGBoost Memory & Micro-SaaS Web Portal
        if: steps.filter.outputs.should_run == 'true'
        run: |
          git config user.name "AETHER Autonomous Swarm"
          git config user.email "swarm@aether.ai"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add .
            git diff --staged --quiet || git commit -m "chore(${{ matrix.pod }}): update XGBoost memory & pSEO workstation"
            git push origin main && break || sleep 4
          done
